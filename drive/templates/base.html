<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Drive{% endblock %} — CloudDrive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --bg2:       #161b27;
      --bg3:       #1e2535;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.12);
      --text:      #e8eaf0;
      --text2:     #8b90a0;
      --text3:     #555c70;
      --accent:    #4f8ef7;
      --accent2:   #3b6fd4;
      --accent-glow: rgba(79,142,247,0.15);
      --green:     #34d399;
      --red:       #f87171;
      --amber:     #fbbf24;
      --radius:    10px;
      --radius-lg: 16px;
      --shadow:    0 4px 24px rgba(0,0,0,0.4);
    }

    html { font-size: 15px; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      height: 58px;
      background: rgba(15,17,23,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 28px;
      gap: 20px;
    }
    .topbar-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-weight: 600; font-size: 1rem; letter-spacing: -0.3px;
    }
    .topbar-logo-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .topbar-spacer { flex: 1; }
    .topbar-user {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; color: var(--text2);
    }
    .topbar-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #4f8ef7, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 600; color: #fff;
    }

    /* ── Layout ── */
    .layout { display: flex; min-height: calc(100vh - 58px); }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-label {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text3);
      padding: 8px 12px 4px;
    }
    .sidebar-link {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 8px;
      text-decoration: none; color: var(--text2);
      font-size: 0.88rem; font-weight: 400;
      transition: all 0.15s;
    }
    .sidebar-link:hover { background: var(--bg3); color: var(--text); }
    .sidebar-link.active { background: var(--accent-glow); color: var(--accent); font-weight: 500; }
    .sidebar-link svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
    .sidebar-link.active svg { opacity: 1; }

    /* ── Main ── */
    .main { flex: 1; padding: 32px 36px; overflow-x: hidden; }

    /* ── Messages ── */
    .messages { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
    .msg {
      padding: 10px 16px; border-radius: var(--radius);
      font-size: 0.875rem; display: flex; align-items: center; gap-10px;
      border: 1px solid transparent;
    }
    .msg.success { background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.2); color: var(--green); }
    .msg.error   { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.2); color: var(--red); }
    .msg.info    { background: var(--accent-glow); border-color: rgba(79,142,247,0.2); color: var(--accent); }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

<header class="topbar">
  <a class="topbar-logo" href="/drive/files/">
    <span class="topbar-logo-icon">☁</span>
    CloudDrive
  </a>
  <div class="topbar-spacer"></div>
  {% if user.is_authenticated %}
  <div class="topbar-user">
    <div class="topbar-avatar">{{ user.username|first|upper }}</div>
    <span>{{ user.username }}</span>
  </div>
  {% endif %}
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Storage</div>
    <a class="sidebar-link active" href="/drive/files/">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      My Drive
    </a>
    <a class="sidebar-link" href="/drive/auth/">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Re-authenticate
    </a>
  </aside>

  <main class="main">
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</div>

{% block extra_js %}{% endblock %}
</body>
</html>
